<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JL Setters — Live Dashboard</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-bg: #050505;
    --brand-surface: #121212;
    --brand-surface-2: #1a1a1a;
    --brand-border: rgba(255, 255, 255, 0.09);
    --brand-border-strong: rgba(255, 255, 255, 0.22);
    --w-1: #ffffff; --w-2: #d9d9d9; --w-3: #adadad;
    --w-gradient: linear-gradient(180deg, var(--w-1) 0%, var(--w-2) 55%, var(--w-3) 100%);
    --w-gradient-h: linear-gradient(90deg, transparent, var(--w-2) 25%, var(--w-1) 50%, var(--w-2) 75%, transparent);
    --blue: #6fa8ff; --pink: #ff8fc6;
    --red: #e2665f; --amber: #f0b429; --green: #6fcf97;
    --text: #f5f5f5; --text-dim: #a8a8a8; --text-faint: #6b6b6b;
    --font-heading: 'Playfair Display', Georgia, serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--brand-bg); color: var(--text); font-family: var(--font-body); }
  a { color: inherit; }

  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 232px; flex-shrink: 0; background: var(--brand-surface); border-right: 1px solid var(--brand-border);
    padding: 22px 14px 40px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .sidebar-brand { padding: 0 8px 20px; }
  .sidebar-brand .name { font-family: var(--font-heading); font-weight: 700; font-size: 18px; }
  .sidebar-brand .sub { color: var(--green); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; margin-top: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 8px; font-size: 13px;
    color: var(--text-dim); cursor: pointer; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; font-family: var(--font-body);
  }
  .nav-item:hover { background: var(--brand-surface-2); color: var(--text); }
  .nav-item.active { background: var(--brand-surface-2); color: var(--text); font-weight: 700; }
  .nav-item .bar { width: 3px; height: 15px; border-radius: 2px; background: var(--text-faint); flex-shrink: 0; }
  .nav-item.blue .bar { background: var(--blue); }
  .nav-item.pink .bar { background: var(--pink); }

  .main-content { flex: 1; min-width: 0; padding: 22px clamp(16px, 3vw, 44px) 60px; }
  @media (max-width: 860px) { .app-shell { flex-direction: column; } .sidebar { width: 100%; height: auto; position: relative; } }

  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .live-pill { display: flex; align-items: center; gap: 8px; background: var(--brand-surface); border: 1px solid var(--brand-border); padding: 8px 14px; border-radius: 999px; font-size: 12px; color: var(--text-dim); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(111,207,151,0.6); animation: pulse 2s infinite; }
  .live-dot.stale { background: var(--red); animation: none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(111,207,151,0.5);} 70%{box-shadow:0 0 0 7px rgba(111,207,151,0);} 100%{box-shadow:0 0 0 0 rgba(111,207,151,0);} }
  .refresh-btn { font-size: 12px; padding: 8px 14px; border: 1px solid var(--brand-border-strong); border-radius: 999px; cursor: pointer; background: var(--brand-surface); color: var(--text-dim); }
  .refresh-btn:hover { color: var(--text); border-color: var(--w-2); }

  .period-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .pill-btn { background: var(--brand-surface); border: 1px solid var(--brand-border); color: var(--text-dim); padding: 7px 14px; border-radius: 999px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .pill-btn:hover { border-color: var(--w-2); color: var(--text); }
  .pill-btn.active { background: var(--w-gradient); border-color: transparent; color: #0a0a0a; font-weight: 700; }
  select.period-select, .date-inputs input { background: var(--brand-surface); border: 1px solid var(--brand-border-strong); color: var(--text); border-radius: 8px; padding: 7px 10px; font-family: var(--font-body); font-size: 12px; color-scheme: dark; }
  .date-inputs { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .date-inputs span { color: var(--text-faint); font-size: 12px; }
  .range-caption { color: var(--text-dim); font-size: 12.5px; margin: 4px 0 20px; }

  .view-head h1 { font-family: var(--font-heading); font-size: 24px; margin: 0; }
  .view-head .sub { color: var(--text-dim); font-size: 12.5px; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em; }

  .card { position: relative; overflow: hidden; background: var(--brand-surface); border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius); box-shadow: 0 22px 44px -28px rgba(0,0,0,0.9); }
  .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--w-gradient-h); opacity: 0.6; }

  .section-h { font-family: var(--font-heading); font-weight: 700; font-size: 15px; margin: 30px 0 12px; color: var(--text); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .section-h .hint { font-family: var(--font-body); font-size: 11px; color: var(--text-faint); font-weight: 500; }

  .hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  .hero-card { padding: 16px 16px 14px; }
  .hero-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); margin-bottom: 8px; }
  .hero-value { font-family: var(--font-heading); font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .rag-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .rag-red { color: var(--red); } .rag-red-dot { background: var(--red); }
  .rag-amber { color: var(--amber); } .rag-amber-dot { background: var(--amber); }
  .rag-green { color: var(--green); } .rag-green-dot { background: var(--green); }

  .person-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .person-card { padding: 16px 18px; }
  .person-card .head { font-family: var(--font-heading); font-weight: 700; font-size: 14px; margin-bottom: 10px; padding-bottom: 8px; border-left: 3px solid var(--w-2); padding-left: 8px; }
  .person-card.blue .head { border-color: var(--blue); }
  .person-card.pink .head { border-color: var(--pink); }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12.5px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .n { color: var(--text-dim); }
  .stat-row .v { font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .substat-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); font-weight: 700; padding: 10px 0 3px; }
  .substat-label:first-child { padding-top: 0; }

  .funnel-card, .adspend-card { padding: 18px 20px; margin-bottom: 14px; }
  .funnel-card .chips, .adspend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 10px; }
  .chip-stat .lbl { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .chip-stat .val { font-family: var(--font-heading); font-size: 19px; font-weight: 700; margin-top: 3px; display: flex; align-items: center; gap: 5px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 7px; }
  thead th { color: var(--text-faint); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--brand-border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.035); }
  tbody tr:hover { background: var(--brand-surface-2); }
  td.num { font-variant-numeric: tabular-nums; }

  .panel-grid { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 14px; margin-bottom: 14px; }
  @media (max-width: 900px) { .panel-grid { grid-template-columns: 1fr; } }
  .panel { padding: 18px 20px 20px; }
  .panel h3 { font-family: var(--font-heading); font-size: 13.5px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel h3 .hint { font-family: var(--font-body); font-size: 10.5px; color: var(--text-faint); font-weight: 500; }
  canvas { width: 100%; display: block; }

  .empty-state { color: var(--text-faint); font-size: 12.5px; padding: 20px 0; text-align: center; }
  .not-connected { color: var(--text-faint); font-size: 12.5px; padding: 16px 0; }
  footer { margin-top: 26px; text-align: center; color: var(--text-faint); font-size: 11px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="name">JL Setters</div><div class="sub">LIVE DASHBOARD</div></div>
    <div id="navWrap"></div>
  </aside>

  <main class="main-content">

<script>
/* ============================================================
   CONFIG
   ============================================================ */
// The team's daily forms moved from Google Sheets to Airtable at this date.
// Everything before it is read from the historical sheets (Blue/Pink/Agency);
// everything on/after it is read from Airtable. This keeps past months
// visible without double-counting the few overlapping late-Aug Airtable rows
// that existed while the two systems briefly ran side by side.
const CUTOVER = '2026-09-01';
const CUTOVER_PREV = '2026-08-31';

const RAG = {
  dmConvo: { red: 3, amber: 8 },
  convoToCall: { red: 2, amber: 5 },
  showPct: { red: 65, amber: 80 },
  closePct: { red: 35, amber: 50 },
  pickupPct: { red: 15, amber: 30 },
  coldBookingPct: { red: 1.5, amber: 3.5 },
  vslBookingPct: { red: 15, amber: 35 },
};
function ragLevel(v, key) {
  const t = RAG[key];
  if (!t || v === null || v === undefined || isNaN(v)) return '';
  if (v < t.red) return 'red';
  if (v <= t.amber) return 'amber';
  return 'green';
}
function ragHtml(v, key, formatted) {
  const lvl = ragLevel(v, key);
  if (!lvl) return `<span>${formatted}</span>`;
  return `<span class="rag-${lvl}">${formatted}</span><span class="rag-dot rag-${lvl}-dot"></span>`;
}

/* ---- Airtable (current, from CUTOVER) field configs ---- */
const DM_SETTER_FIELDS = [
  { key: 'New Inbounds', label: 'New Inbounds', type: 'number' },
  { key: 'New Outbounds', label: 'New Outbounds', type: 'number' },
  { key: 'Follow-ups', label: 'Follow-ups', type: 'number' },
  { key: 'Calls Pitched', label: 'Calls Pitched', type: 'number' },
  { key: 'Calls Booked', label: 'Calls Booked', type: 'number' },
  { key: 'Hours Worked', label: 'Hours Worked', type: 'duration' },
];
const DM_SETTER_PERSON_KEY = 'Name To Text';
const DM_SETTER_DATE_KEY = 'Date';

const CLOSER_FIELDS = [
  { key: 'Cash Collected ', label: 'Cash Collected', type: 'currency' }, // trailing space is exact Airtable field name
  { key: 'Revenue Generated', label: 'Revenue Generated', type: 'currency' },
  { key: 'Calls Taken', label: 'Calls Taken', type: 'number' },
  { key: 'Calls Closed', label: 'Calls Closed', type: 'number' },
];
const CLOSER_PERSON_KEY = 'Closer name to text';
const CLOSER_DATE_KEY = 'Date';
const SRF_PERSON_KEY = 'Closer Name to text';
const SRF_DATE_KEY = 'Call Date';
const SRF_CLIENT_KEY = 'Client Full Name';
const SRF_CLIENT_EMAIL_KEY = 'Client Email';
const SRF_CLIENT_PHONE_KEY = 'Client Phone';
const SRF_OUTCOME_KEY = 'Call Outcome';
const SRF_CASH_KEY = 'Cash Collected';
const SRF_SETTER_KEY = 'Setter/SDR to text';
// Only these two outcomes carry real rep attribution — a "Remainder Collection
// (no call)" row is just a payment against an already-closed deal and has no
// Setter/SDR (sometimes no fresh Closer context either), so AOV attribution
// must come from the client's original close, not the remainder row.
const AOV_ORIGIN_OUTCOMES = ['Deposit', 'Closed/Won'];

const SDR_FUNNELS = [
  { label: 'Pre-Webinar', fields: [
    { key: 'Pre-Webinar Outbound Dials Attempted', label: 'Dials Attempted', type: 'number' },
    { key: 'Pre-Webinar Outbound Dials Conversations', label: 'Conversations', type: 'number' },
  ]},
  { label: 'Show Not Booked', fields: [
    { key: '"Show NOT booked" dials attempted', label: 'Dials Attempted', type: 'number' },
    { key: '"Show NOT booked" calls connected', label: 'Calls Connected', type: 'number' },
    { key: '"Show NOT booked" appointments set', label: 'Appointments Set', type: 'number' },
    { key: 'Quality of "Show NOT booked" calls', label: 'Call Quality', type: 'rating' },
  ]},
  { label: 'No Show Webby', fields: [
    { key: '"No Show Webby" Outbound Dial Attempts', label: 'Dials Attempted', type: 'number' },
    { key: '"No Show Webby" Outbound Dials Connected', label: 'Dials Connected', type: 'number' },
    { key: '"No Show Webby" Replay SMS Links Sent', label: 'Replay SMS Sent', type: 'number' },
    { key: 'Quality of "No Show Webby" calls', label: 'Call Quality', type: 'rating' },
  ]},
  { label: 'Replay Watched', fields: [
    { key: '"Replay Watched" Outbound Dials Attempted', label: 'Dials Attempted', type: 'number' },
    { key: '"Replay Watched" Outbound Dials Connected', label: 'Dials Connected', type: 'number' },
    { key: '"Replay Watched" Appointments Set', label: 'Appointments Set', type: 'number' },
  ]},
  { label: 'Triage', fields: [
    { key: 'Triages Attempted', label: 'Attempted', type: 'number' },
    { key: 'Triages Connected (Made)', label: 'Connected', type: 'number' },
    { key: 'Triage Call Quality', label: 'Call Quality', type: 'rating' },
  ]},
];
const SDR_FIELDS = SDR_FUNNELS.flatMap(f => f.fields);
const SDR_PERSON_KEY = 'SDR name to text';
const SDR_DATE_KEY = 'Date';

/* ---- Legacy Google Sheets (historical, before CUTOVER) config ---- */
const SETTER_LABELS = { jack: "Jack's Setter", lewis: "Lewis' Setter", poppy: "Poppy's Setter" };
const CLOSER_LABELS = { jack: 'Jack Glover', lewis: 'Lewis Sheehy', poppy: 'Poppy Daniels' };

const BLUE_CFG = {
  bookingBlocks: [{ stream: 'blueB2C', unqCol: 8, qlCol: 9 }, { stream: 'blueAgency', unqCol: 34, qlCol: 35 }],
  closerBlocks: [
    { stream: 'blueB2C', idx: [10, 11, 12, 13] },
    { stream: 'blueAgency', idx: [14, 15, 16, 17] },
    { stream: 'blueAffiliateB2C', idx: [18, 19, 20, 21] },
    { stream: 'blueAffiliateAgency', idx: [22, 23, 24, 25] },
    { stream: 'pinkB2C', idx: [26, 27, 28, 29] },
    { stream: 'pinkAgency', idx: [30, 31, 32, 33] },
  ],
};
const PINK_CFG = {
  bookingBlocks: [{ stream: 'pinkB2C', unqCol: 8, qlCol: 9 }, { stream: 'pinkAgency', unqCol: 18, qlCol: 19 }],
  closerBlocks: [{ stream: 'pinkB2C', idx: [10, 11, 12, 13] }, { stream: 'pinkAgency', idx: [14, 15, 16, 17] }],
};

const VIEWS = [
  { key: 'overview', label: 'JL Setters Overview', cls: '' },
  { key: 'setters', label: 'DM Setter Activity', cls: 'blue' },
  { key: 'closers', label: 'Closer Activity', cls: 'blue' },
  { key: 'sdr', label: 'SDR Activity', cls: 'pink' },
];
// Sales Team "Role" field values, exactly as they appear in Airtable — this is
// the roster source of truth per view, so a newly added rep shows up here (even
// with zero submissions yet) as soon as they're added to Sales Team with a Role.
const ROLE_BY_VIEW = { setters: 'DM Setter', closers: 'Closer', sdr: 'SDR' };
// Calendly event types that are webinar-attendee self-bookings — no DM
// Setter is involved, so these never show up in DM Setter EOD's "Calls
// Booked" field. Without folding them in here, Calls Booked undercounts
// against Calls Taken (closers do take these calls; nobody ever logs them
// as "booked" anywhere else). Confirmed with Dillon: "JL Setters Strategy
// Call" is the event type webinar bookings use.
const WEBINAR_CALENDLY_EVENT_TYPES = ['JL Setters Strategy Call'];
function isWebinarBooking(eventType) {
  return WEBINAR_CALENDLY_EVENT_TYPES.some(t => t.trim().toLowerCase() === String(eventType || '').trim().toLowerCase());
}
const PERIODS = ['Day', '7D', '30D', 'Month', '3M', '6M', 'All', 'Custom'];

let state = {
  legacyStream: [], legacyDialler: [],
  dmSetterEod: [], sdrEod: [], closerEod: [], srf: [], salesTeam: [],
  aovByCloser: {}, aovBySetterOrSdr: {}, aovOverall: null,
  calendly: [], adSpend: { connected: false, daily: [] },
  fetchedAt: null,
  floor: '2026-01-01',
  viewKey: 'overview',
  period: '30D', selDay: null, selMonth: null,
  customStart: null, customEnd: null,
};

/* ============================================================
   FORMATTING + PARSING HELPERS
   ============================================================ */
function fmt(n) { if (n === null || n === undefined || isNaN(n)) return '—'; return Math.round(n).toLocaleString(); }
function pct(n) { if (n === null || n === undefined || !isFinite(n) || isNaN(n)) return '—'; return n.toFixed(1) + '%'; }
function gbp(n) { if (n === null || n === undefined || isNaN(n)) return '—'; return '£' + Math.round(n).toLocaleString(); }
function roas(n) { if (n === null || n === undefined || !isFinite(n) || isNaN(n)) return '—'; return n.toFixed(2) + 'x'; }
function durationFmt(sec) {
  if (sec === null || sec === undefined || isNaN(sec)) return '—';
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return `${h}h ${m}m`;
}
function ratingFmt(n) { if (n === null || n === undefined || isNaN(n)) return '—'; return n.toFixed(1) + '/5'; }
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  const cleaned = String(v).replace(/[£$€,]/g, '').replace(/ /g, ' ').trim();
  const f = parseFloat(cleaned);
  return isNaN(f) ? null : f;
}
// Deliberately uses LOCAL getters, not toISOString() — toISOString() forces
// UTC, which silently shifts the date back a day for anyone in a positive
// UTC offset (e.g. UK on BST), truncating the last day of a month/range.
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseUKDate(str) {
  if (!str) return null;
  const datePart = String(str).trim().split(' ')[0];
  const parts = datePart.split('/');
  if (parts.length !== 3) return null;
  let [d, m, y] = parts; if (!d || !m || !y) return null;
  if (y.length === 2) y = '20' + y;
  return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
}
function parseFlexDate(str) {
  const uk = parseUKDate(str);
  if (uk) return uk;
  const s = String(str || '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s);
  return isNaN(d) ? null : toISO(d);
}
function inRange(dateStr, start, end) { return !!dateStr && dateStr >= start && dateStr <= end; }
function daysBetween(start, end) { const s = new Date(start + 'T00:00:00'), e = new Date(end + 'T00:00:00'); return Math.round((e - s) / 86400000) + 1; }
function personFrom(fields, key) {
  const v = fields[key];
  if (Array.isArray(v)) return v.length ? String(v[0]).trim() : 'Unknown';
  return v ? String(v).trim() : 'Unknown';
}

/* ============================================================
   LEGACY PARSING — Google Sheets, wide-format unpivoter. Verbatim
   from the pre-Airtable dashboard (git history), just clamped to
   dates before CUTOVER at fetch time.
   ============================================================ */
function classifySubmitter(raw) {
  const s = String(raw || '').replace(/[’'`]/g, '').trim().toLowerCase();
  if (s.includes('affiliate') || s.includes('(aff)') || s.includes(' aff)')) return { person: 'affiliate', display: 'Affiliate Data' };
  if (s.includes('jacks setter') || s.includes('jack setter') || s.includes('jg setter')) return { person: 'jack', display: "Jack's Setter" };
  if (s.includes('lewiss setter') || s.includes('lewis setter') || s.includes('ls setter')) return { person: 'lewis', display: "Lewis' Setter" };
  if (s.includes('poppys setter') || s.includes('poppy setter')) return { person: 'poppy', display: "Poppy's Setter" };
  if (s.includes('jack glover')) return { person: 'jack', display: 'Jack Glover' };
  if (s.includes('lewis sheehy')) return { person: 'lewis', display: 'Lewis Sheehy' };
  if (s.includes('poppy daniels') || s.includes('poppy')) return { person: 'poppy', display: 'Poppy Daniels' };

async function fetchData() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');

    state.legacyStream = [...parseBlueRows(data.blue || []), ...parsePinkRows(data.pink || [])]
      .filter(r => r.date <= CUTOVER_PREV);
    state.legacyDialler = parseDiallerRows(data.agency || []).filter(r => r.date <= CUTOVER_PREV);

    state.dmSetterEod = parseAirtableRows(data.dmSetterEod, DM_SETTER_DATE_KEY, DM_SETTER_PERSON_KEY).filter(r => r.date >= CUTOVER);
    state.sdrEod = parseAirtableRows(data.sdrEod, SDR_DATE_KEY, SDR_PERSON_KEY).filter(r => r.date >= CUTOVER);
    state.closerEod = parseAirtableRows(data.closerEod, CLOSER_DATE_KEY, CLOSER_PERSON_KEY).filter(r => r.date >= CUTOVER);
    state.srf = parseSrfFunnel(data.srf).filter(r => r.date >= CUTOVER);
    state.salesTeam = parseSalesTeam(data.salesTeam);

    const aovClientTotals = buildAovClientTotals(parseSrfDeals(data.srf));
    state.aovByCloser = aovByPerson(aovClientTotals, 'closer');
    state.aovBySetterOrSdr = aovByPerson(aovClientTotals, 'setter');
    state.aovOverall = aovClientTotals.length ? aovClientTotals.reduce((s, g) => s + g.cash, 0) / aovClientTotals.length : null;

    state.calendly = dedupeCalendlyByPerson(parseCalendlyRows(data.calendly || []));
    state.adSpend = parseAdSpend(data.adSpend);
    state.fetchedAt = new Date(data.fetchedAt);

    const allDatesFound = [
      ...state.legacyStream, ...state.legacyDialler,
      ...state.dmSetterEod, ...state.sdrEod, ...state.closerEod, ...state.srf,
    ].map(r => r.date).filter(Boolean).sort();
    if (allDatesFound.length) state.floor = allDatesFound[0];

    const totalRows = state.legacyStream.length + state.legacyDialler.length
      + state.dmSetterEod.length + state.sdrEod.length + state.closerEod.length + state.srf.length;

}

}

function heroCard(label, text, ragKey, raw) {
  return `<div class="card hero-card"><div class="hero-label">${label}</div><div class="hero-value">${ragKey ? ragHtml(raw, ragKey, text) : text}</div></div>`;
}
function drawLineChart(canvas, buckets, series, colors, labels) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const h = parseInt(canvas.getAttribute('height'), 10) || 220;
  canvas.width = rect.width * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, rect.width, h);
  if (!buckets.length) return;
  const pad = { top: 20, right: 8, bottom: 24, left: 38 };
  const w = rect.width - pad.left - pad.right; const ih = h - pad.top - pad.bottom;
  const maxVal = Math.max(1, ...series.flat());
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const y = pad.top + (ih / 4) * i; ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + w, y); ctx.stroke(); }
  series.forEach((data, si) => {
    ctx.beginPath(); ctx.strokeStyle = colors[si]; ctx.lineWidth = 2.3;
    data.forEach((v, i) => { const x = pad.left + (w / Math.max(1, data.length - 1)) * i; const y = pad.top + ih - (v / maxVal) * ih; i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.stroke();
    data.forEach((v, i) => { const x = pad.left + (w / Math.max(1, data.length - 1)) * i; const y = pad.top + ih - (v / maxVal) * ih; ctx.beginPath(); ctx.fillStyle = colors[si]; ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill(); });
  });
  ctx.fillStyle = '#a8a8a8'; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'center';
  const stride = Math.ceil(buckets.length / 10);
  buckets.forEach((b, i) => { if (i % stride !== 0) return; const x = pad.left + (w / Math.max(1, buckets.length - 1)) * i; ctx.fillText(b.label, x, h - 6); });
  ctx.textAlign = 'left'; let lx = pad.left;
  labels.forEach((label, i) => { ctx.fillStyle = colors[i]; ctx.fillText('● ' + label, lx, 12); lx += label.length * 5.8 + 22; });
}
// Generic accessor-based bucket sum — works for legacy stream rows,
// Airtable rows, or anything else, since the caller supplies how to
// pull a number out of each row.
function bucketSumBy(rows, buckets, accessorFn) {
  return buckets.map(b => rows.filter(r => inRange(r.date, b.start, b.end)).reduce((s, r) => s + (accessorFn(r) || 0), 0));
}
function bucketSum(rows, buckets, fieldKey) { return bucketSumBy(rows, buckets, r => num(r.fields[fieldKey])); }
function addSeries(a, b) { return a.map((v, i) => v + (b[i] || 0)); }

      <div class="chip-stat"><div class="lbl">Cost / Booked</div><div class="val">${costBooked !== null ? gbp(costBooked) : '—'}</div></div>
      <div class="chip-stat"><div class="lbl">Cost / Close</div><div class="val">${costClose !== null ? gbp(costClose) : '—'}</div></div>
      <div class="chip-stat"><div class="lbl">Revenue</div><div class="val">${gbp(revenue)}</div></div>
      <div class="chip-stat"><div class="lbl">ROAS</div><div class="val">${spend ? roas(revRoas) : '—'}</div></div>
    </div></div>`;
}
function renderOverview(range) {
  const { legacy, current } = splitRange(range);
  const legacyRows = legacy ? state.legacyStream.filter(r => inRange(r.date, legacy.start, legacy.end)) : [];
  const legacyT = legacyTotals(legacyRows);

  const currentSetterRows = current ? inRangeRows(state.dmSetterEod, current) : [];
  const currentCloserRows = current ? inRangeRows(state.closerEod, current) : [];
  const currentSrfRows = current ? inRangeRows(state.srf, current) : [];
  const currentSetterTotals = sumFields(currentSetterRows, DM_SETTER_FIELDS);
  const currentCloserTotals = sumFields(currentCloserRows, CLOSER_FIELDS);
  const currentShowed = currentSrfRows.filter(r => r.showed).length;
  const calendlyInRange = state.calendly.filter(c => inRange(c.date, range.start, range.end));
  const webinarBooked = calendlyInRange.filter(c => isWebinarBooking(c.eventType)).length;
  // Current-era DM/outbound booked comes from Calendly too now (any event
  // type that isn't the webinar one), not DM Setter EOD's self-reported
  // "Calls Booked" field — that field is exactly what undercounted before
  // (it's how Taken ended up exceeding Booked), and Calendly is the actual
  // system every real booking lands in regardless of who books it. Legacy
  // (pre-Sept) keeps using the old sheet's own booking columns — that's
  // already what DM Setter Activity's historical section shows, and Calendly
  // volume for that era is a different, untested comparison not worth
  // introducing here.
  const dmFunnelBookedCurrent = current ? calendlyInRange.filter(c => current && inRange(c.date, current.start, current.end) && !isWebinarBooking(c.eventType)).length : 0;

  // Legacy model had no separate "showed" metric — Taken doubled as Showed.
  // Combining eras additively is valid here because Booked/Taken/Cash/Revenue
  // are the same real-world concept in both systems, just different sources.
  const dmsSent = legacyT.dms + (fieldValue(currentSetterTotals, DM_SETTER_FIELDS[1]) || 0);
  const setterBooked = legacyT.booked + dmFunnelBookedCurrent;
  const booked = setterBooked + webinarBooked;
  const taken = legacyT.callsTaken + (fieldValue(currentCloserTotals, CLOSER_FIELDS[2]) || 0);
  const showed = legacyT.callsTaken + currentShowed;
  const closed = legacyT.callsClosed + (fieldValue(currentCloserTotals, CLOSER_FIELDS[3]) || 0);
  const cash = legacyT.cash + (fieldValue(currentCloserTotals, CLOSER_FIELDS[0]) || 0);
  const revenue = legacyT.revenue + (fieldValue(currentCloserTotals, CLOSER_FIELDS[1]) || 0);
  const showPct = taken ? (showed / taken) * 100 : null;
  const closePct = taken ? (closed / taken) * 100 : null;

  document.getElementById('heroGrid').innerHTML = [
    heroCard('DMs Sent (Outbound)', fmt(dmsSent)), heroCard('Calls Booked', fmt(booked)), heroCard('Calls Taken', fmt(taken)),
    heroCard('Show %', pct(showPct), 'showPct', showPct), heroCard('Calls Closed', fmt(closed), 'closePct', closePct),
    heroCard('Cash Collected', gbp(cash)), heroCard('Revenue Generated', gbp(revenue)),
  ].join('');

  let body = '';
  if (legacy && current) body += `<div class="section-h">Combined totals span both Google Sheets (through 31 Aug 2026) and Airtable (from 1 Sept 2026)</div>`;

  body += `<div class="section-h">Funnel — Booked → Taken → Showed → Closed</div>
    <div class="card funnel-card"><div class="chips">
      <div class="chip-stat"><div class="lbl">Booked</div><div class="val">${fmt(booked)}</div></div>
      <div class="chip-stat"><div class="lbl">Taken</div><div class="val">${fmt(taken)}</div></div>
      <div class="chip-stat"><div class="lbl">Showed</div><div class="val">${ragHtml(showPct, 'showPct', fmt(showed))}</div></div>
      <div class="chip-stat"><div class="lbl">Closed</div><div class="val">${ragHtml(closePct, 'closePct', fmt(closed))}</div></div>
    </div></div>`;

  body += `<div class="section-h">Calls Booked — by Funnel <span class="hint">split by Calendly event type: "${WEBINAR_CALENDLY_EVENT_TYPES.join('", "')}" = Webinar, everything else = DM/Outbound</span></div>
    <div class="card funnel-card"><div class="chips">
      <div class="chip-stat"><div class="lbl">DM Setter (Outbound)</div><div class="val">${fmt(setterBooked)}</div></div>
      <div class="chip-stat"><div class="lbl">Webinar (Calendly)</div><div class="val">${fmt(webinarBooked)}</div></div>
      <div class="chip-stat"><div class="lbl">Total Booked</div><div class="val">${fmt(booked)}</div></div>
    </div></div>`;

  body += `<div class="section-h">Calendly Bookings <span class="hint">by event type — from 1 Sept 2026 these all feed Calls Booked above, split into the two funnels shown below</span></div>${renderCalendlyTable(range)}`;
  body += `<div class="section-h">Ad Spend</div>${renderAdSpendCard(range, revenue, booked, closed)}`;

  if (daysBetween(range.start, range.end) >= 2) {
    body += `<div class="section-h">Trend</div><div class="panel-grid">
      <div class="card panel"><h3>Revenue &amp; Cash <span class="hint">by day</span></h3><canvas id="chartOverviewRevCash" height="200"></canvas></div>
      <div class="card panel"><h3>Booked / Taken / Closed <span class="hint">by day</span></h3><canvas id="chartOverviewFunnel" height="200"></canvas></div>
    </div>`;
  }
  return body;
}
function paintOverviewCharts(range) {
  const el = document.getElementById('chartOverviewRevCash'); if (!el) return;
  const buckets = buildBuckets(range.start, range.end);
  const { legacy, current } = splitRange(range);
  const legacyRows = legacy ? state.legacyStream.filter(r => inRange(r.date, legacy.start, legacy.end)) : [];
  const currentCloserRows = current ? inRangeRows(state.closerEod, current) : [];
  const currentSetterRows = current ? inRangeRows(state.dmSetterEod, current) : [];
  const currentSrfRows = current ? inRangeRows(state.srf, current) : [];

  const legacyRevSeries = bucketSumBy(legacyRows.filter(r => r.kind === 'closer'), buckets, r => r.revenue);
  const legacyCashSeries = bucketSumBy(legacyRows.filter(r => r.kind === 'closer'), buckets, r => r.cashCollected);
  const currentRevSeries = bucketSum(currentCloserRows, buckets, 'Revenue Generated');
  const currentCashSeries = bucketSum(currentCloserRows, buckets, 'Cash Collected ');
  drawLineChart(el, buckets, [addSeries(legacyRevSeries, currentRevSeries), addSeries(legacyCashSeries, currentCashSeries)], ['#ffffff', '#adadad'], ['Revenue', 'Cash']);

  const legacyBookedSeries = bucketSumBy(legacyRows.filter(r => r.kind === 'setter'), buckets, r => r.unqBooked + r.qlBooked);
  const legacyTakenSeries = bucketSumBy(legacyRows.filter(r => r.kind === 'closer'), buckets, r => r.callsTaken);
  const legacyClosedSeries = bucketSumBy(legacyRows.filter(r => r.kind === 'closer'), buckets, r => r.callsClosed);
  const currentBookedSeries = bucketSum(currentSetterRows, buckets, 'Calls Booked');
  const currentTakenSeries = bucketSum(currentCloserRows, buckets, 'Calls Taken');
  const currentClosedSeries = bucketSum(currentCloserRows, buckets, 'Calls Closed');
  drawLineChart(document.getElementById('chartOverviewFunnel'), buckets, [
    addSeries(legacyBookedSeries, currentBookedSeries),
    addSeries(legacyTakenSeries, currentTakenSeries),
    addSeries(legacyClosedSeries, currentClosedSeries),
  ], ['#6b6b6b', '#d9d9d9', '#ffffff'], ['Booked', 'Taken', 'Closed']);
}

/* ============================================================
   NAV + PERIOD CONTROLS
   ============================================================ */
function buildNav() {
  const wrap = document.getElementById('navWrap');
  const html = VIEWS.map(v => `<button class="nav-item ${v.cls} ${state.viewKey === v.key ? 'active' : ''}" data-key="${v.key}">
      <span class="bar"></span><span>${v.label}</span>
    </button>`).join('');
  wrap.innerHTML = html;
  wrap.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => {
    state.viewKey = btn.dataset.key; render();
  }));
}
function buildPeriodBar() {
  const bar = document.getElementById('periodBar');
  bar.innerHTML = PERIODS.map(p => `<button class="pill-btn ${state.period === p ? 'active' : ''}" data-p="${p}">${p}</button>`).join('');
  bar.querySelectorAll('.pill-btn').forEach(btn => btn.addEventListener('click', () => { state.period = btn.dataset.p; render(); }));

  const dropdownWrap = document.getElementById('dropdownWrap');
  const customWrap = document.getElementById('customRangeWrap');
  dropdownWrap.style.display = 'none'; customWrap.style.display = 'none';

  if (state.period === 'Day') {
    dropdownWrap.style.display = 'flex';
    const dates = allDates();
    if (!state.selDay || !dates.includes(state.selDay)) state.selDay = dates[dates.length - 1] || null;
    dropdownWrap.innerHTML = `<span>Date:</span><select class="period-select" id="daySelect">${dates.map(d => `<option value="${d}" ${d === state.selDay ? 'selected' : ''}>${d}</option>`).join('')}</select>`;
    document.getElementById('daySelect').addEventListener('change', e => { state.selDay = e.target.value; render(); });
  } else if (state.period === 'Month') {
    dropdownWrap.style.display = 'flex';
    const months = allMonths();
    if (!state.selMonth || !months.includes(state.selMonth)) state.selMonth = months[months.length - 1] || null;
    dropdownWrap.innerHTML = `<span>Month:</span><select class="period-select" id="monthSelect">${months.map(m => `<option value="${m}" ${m === state.selMonth ? 'selected' : ''}>${new Date(m + '-01').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</option>`).join('')}</select>`;
    document.getElementById('monthSelect').addEventListener('change', e => { state.selMonth = e.target.value; render(); });
  } else if (state.period === 'Custom') {
    customWrap.style.display = 'flex';
    if (!state.customStart) state.customStart = state.floor;
    if (!state.customEnd) state.customEnd = allDates().slice(-1)[0] || state.floor;
    document.getElementById('customStart').min = state.floor;
    document.getElementById('customEnd').min = state.floor;
    document.getElementById('customStart').value = state.customStart;
    document.getElementById('customEnd').value = state.customEnd;
  }
}
document.getElementById('customStart').addEventListener('change', e => { state.customStart = e.target.value; render(); });
document.getElementById('customEnd').addEventListener('change', e => { state.customEnd = e.target.value; render(); });
document.getElementById('refreshBtn').addEventListener('click', fetchData);

/* ============================================================
   TOP-LEVEL RENDER
   ============================================================ */
function render() {
  buildNav();
  buildPeriodBar();
  const view = VIEWS.find(v => v.key === state.viewKey) || VIEWS[0];
  const range = currentRange();
  document.getElementById('rangeCaption').textContent = rangeLabel(range.start, range.end);
  document.getElementById('viewTitle').textContent = view.label;
  document.getElementById('viewSub').textContent = state.period === 'Day' || state.period === 'Month' ? (state.selDay || state.selMonth || '') : rangeLabel(range.start, range.end);

  let body = '';
  if (view.key === 'overview') body = renderOverview(range);
  else if (view.key === 'setters') body = renderSetters(range);
  else if (view.key === 'closers') body = renderClosers(range);
  else if (view.key === 'sdr') body = renderSdr(range);

  document.getElementById('viewBody').innerHTML = body;

  if (view.key === 'overview') paintOverviewCharts(range);
  else if (view.key === 'setters') paintSetterCharts(range);
  else if (view.key === 'closers') paintCloserCharts(range);
  else if (view.key === 'sdr') paintSdrCharts(range);

  const totalRows = state.legacyStream.length + state.legacyDialler.length
    + state.dmSetterEod.length + state.sdrEod.length + state.closerEod.length + state.srf.length;
  document.getElementById('footer').textContent = `${totalRows} submissions (historical + Airtable) · ${state.calendly.length} Calendly bookings · last synced ${state.fetchedAt ? state.fetchedAt.toLocaleTimeString() : '—'}`;
}

window.addEventListener('resize', () => render());

fetchData();
</script>
</body>
</html>
